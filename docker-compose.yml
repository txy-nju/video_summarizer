version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: video_summarizer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vs_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: video_summarizer/Dockerfile
    container_name: vs_backend
    restart: unless-stopped
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./temp:/app/temp

  celery_worker:
    build:
      context: ..
      dockerfile: video_summarizer/Dockerfile
    container_name: vs_celery_worker
    restart: unless-stopped
    # 移除了 --pool=solo，使用默认的多进程池提升并发能力。可根据机器配置添加 --concurrency=4
    command: python -m celery -A backend.tasks.celery_app worker --loglevel=info -Q celery,default,low_priority
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./temp:/app/temp

  frontend:
    build:
      context: ..
      dockerfile: video_summarizer/Dockerfile
    container_name: vs_frontend
    restart: unless-stopped
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env.docker
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./temp:/app/temp

volumes:
  postgres_data:
  redis_data:
